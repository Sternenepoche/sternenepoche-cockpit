[package]
name = "sternenepoche-server"
version.workspace = true
edition.workspace = true

[dependencies]
kern = { path = "../kern" }
lauf = { path = "../lauf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
sha2 = "0.10"
rand = "0.8"
argon2 = "0.5"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tiny_http = "0.12"
fs2 = "0.4"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
totp-rs = { version = "5", features = ["otpauth", "qr"] }
chacha20poly1305 = "0.10"
socket2 = "0.6"
qrcodegen = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
