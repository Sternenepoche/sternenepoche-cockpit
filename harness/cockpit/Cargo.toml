[package]
name = "sternenepoche-cockpit"
version = "0.2.4"
edition = "2021"
description = "Sternenepoche Harness Builder und Cockpit: Harness zusammenstellen, lokal bauen, prüfen und spielen"
publish = false
build = "build.rs"

# Eigenständig: wird auch ohne das Spiel-Repository gebaut und verteilt.
[workspace]

[[bin]]
name = "sternenepoche-cockpit"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tiny_http = "0.12"
sternenepoche-server = { path = "../../crates/server" }

[dev-dependencies]
# Nur für Tests: Rechte-Matrix und Missionen gegen den Spielkern prüfen (kern ist über den Server ohnehin im Bau).
kern = { path = "../../crates/kern" }

[build-dependencies]
sha2 = "0.10"

# Linux: eingebettete WebKitGTK-Ansichten brauchen ein initialisiertes GTK (gleiche Version wie wry).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
strip = true
